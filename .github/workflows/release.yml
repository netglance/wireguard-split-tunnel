name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds and uploads an artifact, creates no release

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compute version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Check the event, not the ref type: a manual dispatch on a tag ref must stay a dry run.
          if [ "$EVENT_NAME" = push ]; then
            version="${REF_NAME#v}"
            if ! awk -v h="## [$version]" 'index($0, h) == 1 {f=1} END {exit !f}' CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$version]' section; add it before tagging."
              exit 1
            fi
          else
            version=0.0.0-dry
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: swift test
      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/make-app.sh "$VERSION"
      - name: Checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          shasum -a 256 "SplitTunnel-$VERSION.zip" > "SplitTunnel-$VERSION.sha256"
          cat "SplitTunnel-$VERSION.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTunnel
          path: |
            dist/SplitTunnel-${{ steps.version.outputs.version }}.zip
            dist/SplitTunnel-${{ steps.version.outputs.version }}.sha256

  release:
    needs: build
    # Same event check as above: only a tag push publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: SplitTunnel
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Notes = the CHANGELOG section "## [<version>]", up to the next "## [" heading.
          notes=$(awk -v h="## [$VERSION]" 'index($0, h) == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)
          flags=()
          # A version with a suffix (0.2.0-rc.1) is a pre-release.
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          # No --clobber: creating over an existing release must fail.
          gh release create "$GITHUB_REF_NAME" \
            "dist/SplitTunnel-$VERSION.zip" "dist/SplitTunnel-$VERSION.sha256" \
            --title "Split Tunnel $VERSION" --notes "${notes:-See CHANGELOG.md}" --verify-tag "${flags[@]}"
