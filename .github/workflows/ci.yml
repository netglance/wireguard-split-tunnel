name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: scripts/make-app.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: SplitTunnel-ci
          path: dist/SplitTunnel-0.0.0-ci.zip
          retention-days: 7
